<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortgage Calculator — FreeCalcNow Widget</title>
<meta name="description" content="Free mortgage calculator widget by FreeCalcNow. Monthly payment with taxes and insurance.">
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f8fafc;color:#0f172a}main{max-width:420px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 2px;color:#166534}.sub{color:#475569;font-size:13px;margin:0 0 12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}.field{margin-bottom:10px}label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}input{width:100%;padding:10px;font-size:16px;border:2px solid #cbd5e1;border-radius:8px}.big{font-size:30px;font-weight:800;color:#166534;margin:10px 0 2px}.note{font-size:13px;color:#475569}.credit{text-align:center;font-size:12px;color:#64748b;margin-top:12px}.credit a{color:#166534;font-weight:700}</style>
</head>
<body><main>
<h1>Mortgage Calculator</h1>
<p class="sub">Monthly payment, with taxes &amp; insurance.</p>
<div class="card">
<div class="field"><label for="w_price">Home price ($)</label><input id="w_price" type="number" value="320000" min="0"></div>
<div class="field"><label for="w_down">Down payment ($)</label><input id="w_down" type="number" value="70000" min="0"></div>
<div class="field"><label for="w_r">Interest rate (% per year)</label><input id="w_r" type="number" value="6.5" min="0" max="30" step="any"></div>
<div class="field"><label for="w_t">Term (years)</label><input id="w_t" type="number" value="30" min="1" max="50"></div>
<div class="field"><label for="w_tax">Property tax ($ per year, optional)</label><input id="w_tax" type="number" value="3600" min="0"></div>
<div class="field"><label for="w_ins">Home insurance ($ per year, optional)</label><input id="w_ins" type="number" value="1500" min="0"></div>
<div class="big" id="w_big">—</div>
<p class="note" id="w_sub"></p>
</div>
<p class="credit">Powered by <a href="https://freecalcnow.github.io/mortgage/" target="_blank" rel="noopener">FreeCalcNow — Mortgage Calculator</a></p>
</main>
<script>
function money(v){return "$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function calc(){
  var P=Math.max(0,(+document.getElementById('w_price').value||0)-(+document.getElementById('w_down').value||0));
  var r=(+document.getElementById('w_r').value||0)/100/12, n=Math.round((+document.getElementById('w_t').value||30)*12);
  var pay=r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  var monthly=pay+(+document.getElementById('w_tax').value||0)/12+(+document.getElementById('w_ins').value||0)/12;
  document.getElementById('w_big').textContent=money(monthly)+" / month";
  document.getElementById('w_sub').textContent="Loan payment "+money(pay)+" + tax & insurance. Total interest over the term: "+money(pay*n-P)+".";
}
document.querySelectorAll('input').forEach(function(el){el.addEventListener('input',calc);});
calc();
</script>
</body>
</html>
